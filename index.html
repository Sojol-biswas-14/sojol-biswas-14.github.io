  <style>
    /* === RESET & BASE === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
      color: #fff;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    body.light-mode {
      background: #fff;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    h1, h2, h3, h4 {
      font-weight: 600;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* Smooth fade-in animations */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
/* === PROFILE / HEADER === */
    .profile {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      background: #1f1f1f;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
      margin-top: 40px;
      gap: 30px;
    }

    .profile img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid #00ffcc;
    }

    .profile-info {
      flex: 1;
      min-width: 250px;
    }

    .profile-info h1 {
      font-size: 28px;
      color: #00ffcc;
    }

    .tagline {
      font-style: italic;
      color: #aaa;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .bio {
      color: #ccc;
      line-height: 1.6;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .links a {
      display: inline-block;
      margin: 6px 8px 6px 0;
      padding: 10px 16px;
      background-color: #00ffcc20;
      color: #00ffcc;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .links a:hover {
      background-color: #00ffcc40;
      transform: translateY(-2px);
      box-shadow: 0 0 10px #00ffcc80;
    }

    /* === CATEGORY GRID === */
    .gallery-intro {
      text-align: center;
      margin-top: 60px;
    }

    .gallery-intro h2 {
      font-size: 26px;
      color: #00ffcc;
      margin-bottom: 10px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .categories a {
      padding: 18px;
      background-color: #141414;
      border: 2px solid #00ffcc20;
      border-radius: 12px;
      text-align: center;
      color: #00ffcc;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
    }

    .categories a::after {
      content: "";
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 28px;
      height: 28px;
      background: url('images/logo.png') no-repeat center/contain;
      opacity: 0.3;
      pointer-events: none;
    }

    .categories a:hover {
      background-color: #00ffcc20;
      transform: scale(1.05);
      box-shadow: 0 0 10px #00ffcc66;
    }

    /* === TOGGLES & BUTTONS === */
    .theme-toggle,
    .back-button {
      position: fixed;
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      z-index: 999;
      transition: all 0.3s ease;
    }

    .theme-toggle {
      top: 20px;
      right: 20px;
      background: #00ffcc20;
      color: #00ffcc;
    }

    .theme-toggle:hover {
      background-color: #00ffcc40;
      box-shadow: 0 0 8px #00ffcc66;
    }

    .back-button {
      top: 20px;
      left: 20px;
      background: #00ffcc20;
      color: #00ffcc;
    }

    .back-button:hover {
      background-color: #00ffcc40;
      box-shadow: 0 0 8px #00ffcc66;
    }

    .back-button.hidden {
      opacity: 0;
      pointer-events: none;
    }

    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #333;
      text-align: center;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 768px) {
      .profile {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .theme-toggle, .back-button {
        font-size: 14px;
        padding: 8px 12px;
      }

      .profile img {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
