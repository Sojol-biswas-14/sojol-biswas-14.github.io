<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create 2D Avatar – Sojol Biswas</title>
  <meta name="description" content="Customize your 2D avatar with hair, eyes, face shape, and colors. Download or share your creation." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #111;
      color: #eee;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 960px;
      margin: auto;
      padding: 40px 20px;
    }
    h1 {
      color: #00ffcc;
      text-align: center;
    }
    .editor {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      margin-top: 40px;
    }
    .preview {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 4px solid #00ffcc88;
      background-color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .preview img {
      width: 100%;
      height: auto;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .control-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 6px;
    }
    select, input[type="color"] {
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #222;
      color: #00ffcc;
    }
    .actions {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .actions button {
      background: #00ffcc;
      color: #111;
      border: none;
      padding: 12px 20px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .actions button:hover {
      background: #00ccaa;
    }
    .theme-toggle, .back-button {
      position: fixed;
      z-index: 999;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #00ffcc20;
      color: #00ffcc;
      transition: all 0.3s ease;
    }
    .theme-toggle {
      top: 20px;
      right: 20px;
    }
    .back-button {
      top: 20px;
      left: 20px;
    }
    footer {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="history.back()">⬅ Back</button>
  <button class="theme-toggle" onclick="document.body.classList.toggle('light-mode')">🌓 Theme</button>  <div class="container">
    <h1>🎨 Create Your 2D Avatar</h1><div class="editor">
  <div class="preview">
    <img id="avatarPreview" src="images/avatar/default.png" alt="Avatar Preview" />
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="faceShape">Face Shape</label>
      <select id="faceShape">
        <option value="oval">Oval</option>
        <option value="round">Round</option>
        <option value="square">Square</option>
      </select>
    </div>

    <div class="control-group">
      <label for="eyeType">Eye Style</label>
      <select id="eyeType">
        <option value="normal">Normal</option>
        <option value="anime">Anime</option>
        <option value="sharp">Sharp</option>
      </select>
    </div>

    <div class="control-group">
      <label for="hairStyle">Hair Style</label>
      <select id="hairStyle">
        <option value="short">Short</option>
        <option value="long">Long</option>
        <option value="spiky">Spiky</option>
      </select>
    </div>

    <div class="control-group">
      <label for="hairColor">Hair Color</label>
      <input type="color" id="hairColor" value="#00ffcc" />
    </div>

    <div class="control-group">
      <label for="bgColor">Background</label>
      <input type="color" id="bgColor" value="#222222" />
    </div>

    <div class="actions">
      <button onclick="downloadAvatar()">⬇ Download</button>
      <button onclick="shareAvatar()">📤 Share</button>
    </div>
  </div>
</div>

<footer>
  &copy; 2025 Sojol Biswas – 2D Avatar Generator
</footer>

  </div>  <script>
    const avatarPreview = document.getElementById("avatarPreview");
    const hairColor = document.getElementById("hairColor");
    const bgColor = document.getElementById("bgColor");

    hairColor.addEventListener("input", () => {
      avatarPreview.style.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg)`;
    });
    bgColor.addEventListener("input", () => {
      avatarPreview.parentElement.style.backgroundColor = bgColor.value;
    });

    function downloadAvatar() {
      alert("Download feature will export this avatar image as PNG (coming soon)");
    }
    function shareAvatar() {
      alert("This will let you share your avatar via Web Share API or link (demo)");
    }
  </script></body>
</html>
